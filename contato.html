<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Entre em contato com a equipe do site para enviar dúvidas, sugestões ou relatos de fenômenos sobrenaturais.">
    <title>Contato - Invocação do Mal</title>
</head>
<body>
    <header>
        <h1> Gostou do conteúdo? Fale com a gente!</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <img src="https://images.unsplash.com/photo-1603516863860-7d5c93a83fe8?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="Pessoa com máscara assustadora e fantasia segurando uma esfera brilhante." width="400">
            <h2>Envie sua mensagem ou relato</h2>
            <p>Tem alguma dúvida sobre os filmes ou quer relatar um <strong>fenômeno inexplicável</strong>? Preencha o formulário abaixo:</p>
            
            <form action="#" method="POST">
                <div>
                    <label for="nome">Nome:</label><br>
                    <input type="text" id="nome" name="nome" required>
                </div>
                <br>
                <div>
                    <label for="email">E-mail:</label><br>
                    <input type="email" id="email" name="email" required>
                </div>
                <br>
                <div>
                    <label for="assunto">Assunto:</label><br>
                    <input type="text" id="assunto" name="assunto" required>
                </div>
                <br>
                <div>
                    <label for="categoria">Categoria:</label><br>
                    <select id="categoria" name="categoria">
                        <option value="duvida">Dúvida sobre o filme</option>
                        <option value="sugestao">Sugestão de tema</option>
                        <option value="relato">Relato sobrenatural</option>
                    </select>
                </div>
                <br>
                <div>
                    <label for="comentario">Comentário:</label><br>
                    <textarea id="comentario" name="comentario" rows="4" cols="40" required></textarea>
                </div>
                <br>
                <div>
                    <button type="submit">Enviar Mensagem</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 - Vicente Santos</p>
    </footer>
</body>
</html>
